# Helios is entirely static: no server-side state, no user input, no database.
# The whole attack surface is this file server, so it is locked down accordingly.

# Cache-Control is chosen by a map rather than per-location `add_header`,
# because add_header does NOT accumulate: a directive in any location silently
# discards every add_header inherited from the server block. Setting cache
# headers per location therefore dropped all the security headers below, on
# every URL. Doing it this way keeps the headers in exactly one place.
# A request for a directory without a trailing slash gets a 301, and nginx
# builds that Location from the *client's* Host header — so `Host: evil.com`
# came back as `Location: http://evil.com:8080/src/`. Behind a caching proxy
# that is cache poisoning; it also leaked the container's internal port into
# every redirect, which would be simply wrong behind a terminator on 443.
# A relative Location is correct in both cases.
#
# Cache-Control is chosen by a map rather than per-location `add_header`,
# because add_header does NOT accumulate: a directive in any location silently
# discards every add_header inherited from the server block. Setting cache
# headers per location therefore dropped all the security headers below, on
# every URL. Doing it this way keeps the headers in exactly one place.

# One client should not be able to occupy the whole server. Keyed on
# $server_name, not the client address, deliberately: behind the reverse proxy
# this is designed to sit behind, every request arrives from the proxy's IP, so
# a per-IP limit would either throttle everyone at once or be meaningless.
# Per-client fairness is the terminator's job, where the real addresses are.
limit_conn_zone $server_name zone=helios_total:1m;

map $uri $helios_cache {
    default      "no-cache";
    ~^/assets/   "public, max-age=2592000, immutable";
    ~^/vendor/   "public, max-age=2592000, immutable";
}

server {
    listen       8080;

    # A catch-all, because this image does not know the domain it will be
    # deployed at. nginx accepts absolute-form request targets
    # (`GET http://other.example/ HTTP/1.1`) and takes the host from the URI,
    # so a catch-all answers for any name asked of it. Nothing here reflects
    # the host into a response -- absolute_redirect is off and no page echoes
    # it -- so there is no injection point today. But if this sits behind a
    # CDN or caching proxy, pin the real name and turn away everything else,
    # so the two layers cannot be made to disagree about which site this is:
    #
    #   server {  listen 8080 default_server;  return 444;  }
    #   server {  listen 8080;  server_name helios.example.com;  ... }
    #
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # No directory listings. The dev server had them on, which published the
    # whole tree including test pages and unused assets.
    autoindex off;
    absolute_redirect off;

    # Nothing in the image is a symlink. If someone bind-mounts the source tree
    # over the root instead — a plausible dev variant of this compose file — a
    # symlink out of it would otherwise be followed and served.
    disable_symlinks on;

    limit_conn helios_total 256;

    # Do not advertise the version.
    server_tokens off;

    # Everything the page needs is same-origin: three.js is vendored, the
    # textures and models are local, and nothing is fetched at runtime. So the
    # policy can be tight. 'unsafe-inline' is required for scripts only because
    # an import map has to be inline — external import maps are not supported —
    # and the app's bootstrap error handler sits beside it. There is no
    # user-controlled content anywhere on the page for it to be leveraged from.
    #
    # `blob:` in img-src is load-bearing: GLTFLoader turns textures embedded in
    # a .glb into blob URLs (vendor/GLTFLoader.js:3390). There is no Worker
    # anywhere in the app or in three.js as vendored, so worker-src is omitted
    # and falls back to default-src 'self'.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options      "nosniff"     always;
    add_header Referrer-Policy             "no-referrer" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cache-Control $helios_cache always;
    # Strict-Transport-Security belongs on the TLS terminator in front of this,
    # not on a plain-HTTP origin.

    # There is no write path at all: refuse anything that is not a read.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # nginx still answers HTTP/0.9 -- a bare `GET /` with no version, which by
    # definition has no status line and no headers. It therefore returns the
    # page with none of the security headers above attached. No browser can be
    # made to speak 0.9, so this is not reachable in an attack on a user, but
    # "serves the page with the whole policy missing" is not a path worth
    # keeping for a protocol retired in 1996. $server_protocol is empty there.
    if ($server_protocol = "") { return 444; }

    # A multi-range request makes nginx assemble one multipart response per
    # range, so a few hundred ranges against the 44 MB station model is cheap to
    # ask for and expensive to answer -- the shape of the old Apache range DoS.
    # One range still covers every real use: resuming a download and seeking.
    max_ranges 1;

    # Hidden files, and the probe endpoint the dev server exposes. These are
    # regex locations and are matched in order, so they win over the type rules
    # below: a dotfile is still a 404 whatever its extension.
    location ~ /\.   { return 404; }
    location /_probe { return 404; }

    # nginx's stock mime.types predates these three extensions, so they are
    # served as application/octet-stream — and with nosniff set, the browser
    # will refuse to render CREDITS.md rather than guess. Do NOT fix this with
    # a `types { ... }` block: that directive REPLACES the inherited table
    # wholesale rather than extending it, which silently turns index.html and
    # every .js file into octet-stream and stops the app loading entirely.
    # default_type only fills in where the table has no answer, so it is safe.
    location ~ \.md$   { default_type text/markdown; }
    location ~ \.gltf$ { default_type model/gltf+json; }
    location ~ \.glb$  {
        default_type model/gltf-binary;
        # ISS_stationary.glb is 44 MB and is fetched by anyone who flies near
        # Earth. Let it start fast, then cap it, so a few clients pulling it at
        # once degrade to slow rather than starving everything else.
        limit_rate_after 4m;
        limit_rate       8m;
    }

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json model/gltf+json image/svg+xml;
    gzip_min_length 1024;
    # GLB and the PNG/JPEG textures are already compressed; re-gzipping them
    # only burns CPU, so they are deliberately absent from that list.

    # A directory with autoindex off answers 403, which tells a prober the
    # directory exists. Answer the same 404 as a path that does not.
    error_page 403 =404 @notfound;
    location @notfound { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nothing here accepts a request body; keep the limit small so a POST that
    # is going to be refused with 405 cannot be used to push bytes first.
    client_max_body_size 1k;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         60s;

    sendfile on;
    tcp_nopush on;
}
