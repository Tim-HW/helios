# Helios is a static site: no server-side state, no user input, no database.

# Cache-Control comes from a map, not from per-location `add_header`. This is
# deliberate and load-bearing: `add_header` does NOT accumulate, so a single one
# inside a `location` discards every header inherited from the `server` block.
# Setting cache headers per location silently drops all the headers below.
map $uri $helios_cache {
    default      "no-cache";
    ~^/assets/   "public, max-age=2592000, immutable";
    ~^/vendor/   "public, max-age=2592000, immutable";
}

limit_conn_zone $server_name zone=helios_total:1m;

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    autoindex off;
    absolute_redirect off;
    disable_symlinks on;
    server_tokens off;
    limit_conn helios_total 256;

    # Everything the page needs is same-origin: three.js is vendored, the
    # textures and models are local, nothing is fetched at runtime.
    #
    # Two parts of this are load-bearing and should not be "tidied":
    #   'unsafe-inline' in script-src — an import map must be inline, because
    #     browsers do not support external ones.
    #   blob: in img-src — GLTFLoader turns textures embedded in a .glb into
    #     blob URLs (vendor/GLTFLoader.js:3390).
    # There is no Worker in the app or in three.js as vendored, so worker-src is
    # omitted and falls back to default-src.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options      "nosniff"     always;
    add_header Referrer-Policy             "no-referrer" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cache-Control $helios_cache always;

    # The site is read-only; there is no write path to reach.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($server_protocol = "") { return 444; }

    max_ranges 1;

    # Matched in order, so these win over the type rules below.
    location ~ /\.   { return 404; }
    location /_probe { return 404; }

    # nginx's stock mime.types predates these three extensions. Do NOT fix that
    # with a `types { ... }` block: that directive REPLACES the inherited table
    # rather than extending it, which turns index.html and every .js file into
    # application/octet-stream and stops the app loading. `default_type` only
    # fills in where the table has no answer.
    location ~ \.md$   { default_type text/markdown; }
    location ~ \.gltf$ { default_type model/gltf+json; }
    location ~ \.glb$  {
        default_type model/gltf-binary;
        # The station model is 44 MB and is fetched by anyone who flies near
        # Earth. Start fast, then cap, so concurrent pulls degrade to slow.
        limit_rate_after 4m;
        limit_rate       8m;
    }

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json model/gltf+json image/svg+xml;
    gzip_min_length 1024;
    # GLB and the JPEG textures are already compressed; re-gzipping them only
    # burns CPU, so they are deliberately absent from that list.

    error_page 403 =404 @notfound;
    location @notfound { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    client_max_body_size 1k;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         60s;

    sendfile on;
    tcp_nopush on;
}
