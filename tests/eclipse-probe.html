<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Eclipse probe</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<style>
 body{background:#0a0d14;color:#dbe4f0;font:12px/1.45 ui-monospace,Menlo,monospace;padding:14px}
 .pass{color:#7ddc9a}.fail{color:#ff8a70}.dim{color:#8394ab}
 figure{display:inline-block;margin:0 8px 8px 0}
 figcaption{color:#8394ab;font-size:10px;text-align:center}
 canvas{border:1px solid #2a3140;display:block}
 pre{white-space:pre-wrap;margin:0 0 8px}
</style></head>
<body>
<h1 style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8394ab">
Eclipse probe — do real eclipses happen on the real dates?</h1>
<pre id="log">running…</pre><div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { SolarSystem } from '../src/solar/bodies.js';
import { julianDate } from '../src/solar/kepler.js';

const L=[]; const say=(c,m)=>{L.push(`<span class="${c}">${m}</span>`);
  document.getElementById('log').innerHTML=L.join('\n');};
const captured=[]; for(const k of ['error','warn']){const o=console[k].bind(console);
  console[k]=(...a)=>{captured.push(`[${k}] ${a.map(String).join(' ')}`);o(...a);};}

try {
  const S = 300;
  const canvas = document.createElement('canvas');
  canvas.width=S; canvas.height=S;
  const r = new THREE.WebGLRenderer({ canvas, antialias:true,
    logarithmicDepthBuffer:true, preserveDrawingBuffer:true });
  r.setSize(S,S,false); r.setClearColor(0x000000,1);
  r.toneMapping = THREE.NeutralToneMapping;

  const scene = new THREE.Scene();
  const system = new SolarSystem();
  scene.add(system.root);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 1e10);
  const res = new THREE.Vector2(S,S);
  const opts = { showMarkers:false, realisticLight:false, exaggeration:1, time:0 };
  const buf = new Uint8Array(S*S*4);

  // Look at a body from the Sun's side, so the whole lit face is visible and any
  // shadow falling on it is unmistakable.
  function sunward(id, iso, fill, label, keep, quiet) {
    const jd = julianDate(new Date(iso));
    system.updatePositions(jd);
    const b = system.byId.get(id);
    const R = b.renderRadius;
    const dist = R / (fill * Math.tan(cam.fov * Math.PI/360));
    const sd = b.worldPos.clone().negate().normalize();   // toward the Sun
    cam.position.copy(b.worldPos).addScaledVector(sd, dist);
    cam.lookAt(b.worldPos);
    cam.updateMatrixWorld(true);
    system.updateAppearance(cam, res, opts);
    r.render(scene, cam);

    const gl = r.getContext();
    gl.readPixels(0,0,S,S,gl.RGBA,gl.UNSIGNED_BYTE,buf);
    // Darkest patch anywhere on the lit disc: a shadow shows up as a local
    // minimum far below the surrounding surface.
    // Mean over the lit disc, and the darkest single pixel well INSIDE it.
    // Restricting to the middle of the disc excludes the terminator and the
    // limb, which are darker than everything else and would otherwise swamp the
    // measurement. An eclipse umbra is only a couple of pixels across at this
    // scale, so a block minimum would miss it entirely -- this is per-pixel.
    let bright=0, n=0, darkest=999;
    const cx = S/2, cy = S/2, inner = (fill * S / 2) * 0.55;
    for (let y=0;y<S;y++) for (let x=0;x<S;x++){
      const i=(y*S+x)*4;
      const v=(buf[i]+buf[i+1]+buf[i+2])/3;
      if (v>14){ bright+=v; n++; }
      const dx=x-cx, dy=y-cy;
      if (dx*dx+dy*dy < inner*inner && v < darkest) darkest = v;
    }
    const mean = bright/Math.max(n,1);
    const depth = 1 - darkest/Math.max(mean,1);
    if (quiet && depth < 0.3) return depth;      // sweeps only report what they find
    say(keep(depth) ? 'pass':'fail',
      `${label.padEnd(38)} mean ${mean.toFixed(1).padStart(6)}  darkest patch `
      + `${darkest.toFixed(1).padStart(6)}  → ${(depth*100).toFixed(0)}% below mean`);

    const c=document.createElement('canvas'); c.width=S; c.height=S;
    c.getContext('2d').drawImage(canvas,0,0);
    const f=document.createElement('figure'); f.appendChild(c);
    const cap=document.createElement('figcaption'); cap.textContent=label;
    f.appendChild(cap); document.getElementById('out').appendChild(f);
    return depth;
  }

  // --- 1. Does the shadow maths work at all? -------------------------------
  // Put the Moon exactly on the Earth-Sun line by hand. This tests the shader
  // in isolation, with no dependence on how good the ephemeris is.
  say('dim','SHADOW GEOMETRY — Moon placed exactly on the Earth–Sun line by hand.');
  {
    const jd = julianDate(new Date('2026-08-12T17:46:00Z'));
    system.updatePositions(jd);
    const earth = system.byId.get('earth');
    const moon = system.byId.get('moon');
    // Moon's node is expressed relative to Earth; put it straight sunward.
    const sunward = earth.worldPos.clone().negate().normalize();
    moon.orbitNode.position.copy(sunward).multiplyScalar(384400);
    system.root.updateMatrixWorld(true);
    for (const b of system.bodies) b.orbitNode.getWorldPosition(b.worldPos);

    const S2 = S;
    const R = earth.renderRadius;
    const dist = R / (0.92 * Math.tan(cam.fov * Math.PI/360));
    cam.position.copy(earth.worldPos).addScaledVector(sunward, dist);
    cam.lookAt(earth.worldPos);
    cam.updateMatrixWorld(true);
    system.updateAppearance(cam, res, opts);
    r.render(scene, cam);
    const gl = r.getContext();
    gl.readPixels(0,0,S2,S2,gl.RGBA,gl.UNSIGNED_BYTE,buf);
    let mean=0,n=0,mn=999;
    for (let i=0;i<buf.length;i+=4){
      const v=(buf[i]+buf[i+1]+buf[i+2])/3;
      if (v>14){ mean+=v; n++; if (v<mn) mn=v; }
    }
    mean/=Math.max(n,1);
    const depth = 1 - mn/Math.max(mean,1);
    say(depth>0.6?'pass':'fail',
      `  umbra on the sub-solar point: darkest ${mn.toFixed(1)} vs mean ${mean.toFixed(1)}`
      + `  → ${(depth*100).toFixed(0)}% blocked`);
    const c=document.createElement('canvas'); c.width=S2; c.height=S2;
    c.getContext('2d').drawImage(canvas,0,0);
    const f=document.createElement('figure'); f.appendChild(c);
    const cap=document.createElement('figcaption');
    cap.textContent='Moon forced onto the Earth–Sun line';
    f.appendChild(cap); document.getElementById('out').appendChild(f);
  }

  // --- 2. The real eclipse, swept in time ------------------------------------
  say('','');
  say('dim','SOLAR ECLIPSE — 12 August 2026, a real total eclipse over Iceland and Spain.');
  say('dim','Swept ±6 h, looking for the deepest shadow the ephemeris actually produces.');
  {
    let best = 0, bestT = '';
    for (let m = -360; m <= 360; m += 20) {
      const t = new Date(Date.UTC(2026,7,12,17,46) + m*60000);
      const d = sunward('earth', t.toISOString(), 0.92, `Earth ${t.toISOString().slice(11,16)}`, ()=>true, true);
      if (d > best) { best = d; bestT = t.toISOString(); }
    }
    say(best>0.30?'pass':'fail',
      `  deepest shadow over the window: ${(best*100).toFixed(0)}% at ${bestT.slice(0,16)}`);
  }

  say('','');
  say('dim','LUNAR ECLIPSE — 3 March 2026, the Moon passes through Earth’s shadow.');
  sunward('moon','2026-03-03T11:33:00Z',0.55,'Moon · 2026-03-03 11:33 UTC',d=>d>0.5);
  sunward('moon','2026-03-10T11:33:00Z',0.55,'Moon · a week later (control)',d=>d<0.30);

  say('','');
  say('dim','JUPITER — the Galilean moons throw shadows across it constantly.');
  {
    let best=0, bestIso='';
    for (let h=0; h<42; h+=6) {
      const iso = new Date(Date.UTC(2026,7,1,h)).toISOString();
      const d = sunward('jupiter', iso, 0.60, `Jupiter · ${iso.slice(0,13)}h`, ()=>true, h>0);
      if (d>best){ best=d; bestIso=iso; }
    }
    say(best>0.10?'pass':'fail',
        `  deepest moon shadow over 42 h: ${(best*100).toFixed(0)}% at ${bestIso.slice(0,16)}`);
  }

  say('','');
  say(captured.length?'fail':'pass',
      captured.length?`${captured.length} console message(s):`:'no console errors or warnings');
  for(const c of captured) say('fail','  '+c.slice(0,600));
  say('pass','PROBE COMPLETE');
} catch(e){ say('fail','THREW: '+(e?.stack||e)); }
</script></body></html>
